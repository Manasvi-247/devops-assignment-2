# Two containers in one pod, to show that a pod is the unit of scheduling and
# that containers inside it share a network namespace and a volume.
apiVersion: v1
kind: Pod
metadata:
  name: shared-pod
  namespace: k8s-basics
  labels:
    app: shared-pod
spec:
  volumes:
    - name: shared
      emptyDir: {}
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - 'i=0; while true; do i=$((i+1)); echo "line $i from the writer" >> /data/log.txt; sleep 2; done'
      volumeMounts:
        - name: shared
          mountPath: /data
      resources:
        requests: {cpu: "10m", memory: "16Mi"}
        limits: {cpu: "50m", memory: "32Mi"}
    - name: reader
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: shared
          mountPath: /data
      resources:
        requests: {cpu: "10m", memory: "16Mi"}
        limits: {cpu: "50m", memory: "32Mi"}
