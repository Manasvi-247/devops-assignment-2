apiVersion: v1
kind: Pod
metadata:
  name: first-pod
  namespace: k8s-basics
  labels:
    app: first-pod
spec:
  containers:
    - name: web
      image: nginxdemos/nginx-hello:plain-text
      ports:
        - name: http
          containerPort: 8080
      resources:
        requests:
          cpu: "25m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
