# stringData keeps the file readable. Written with -n semantics by the API
# server, so there is no trailing newline in the stored value.
apiVersion: v1
kind: Secret
metadata:
  name: yatri-db-secret
  namespace: app-config
type: Opaque
stringData:
  POSTGRES_USER: "yatri_admin"
  POSTGRES_PASSWORD: "secretpassword"
