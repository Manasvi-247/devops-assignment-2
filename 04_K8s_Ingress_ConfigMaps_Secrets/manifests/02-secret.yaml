# Written with stringData so the file stays readable. Kubernetes base64 encodes
# it on the way in. base64 is encoding, not encryption: anyone with get access
# on secrets in this namespace can read it back.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: app-config
type: Opaque
stringData:
  DB_USER: "checkout_app"
  DB_PASSWORD: "s3cr3t-p@ssw0rd"
