# One pod consuming config four ways at once: env from configmap, env from
# secret, a configmap mounted as a file, and a secret mounted as a file.
apiVersion: v1
kind: Pod
metadata:
  name: config-consumer
  namespace: app-config
  labels:
    app: config-consumer
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      env:
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: app-settings
              key: APP_NAME
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-settings
              key: LOG_LEVEL
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_PASSWORD
      volumeMounts:
        - name: settings
          mountPath: /etc/app
          readOnly: true
        - name: creds
          mountPath: /etc/creds
          readOnly: true
      resources:
        requests: {cpu: "10m", memory: "16Mi"}
        limits: {cpu: "50m", memory: "32Mi"}
  volumes:
    - name: settings
      configMap:
        name: app-settings
    - name: creds
      secret:
        secretName: db-credentials
