# A working deployment, used as the baseline for the read-only commands.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: triage
  labels: {app: shop}
spec:
  replicas: 2
  selector:
    matchLabels: {app: shop}
  template:
    metadata:
      labels: {app: shop, tier: web}
    spec:
      containers:
        - name: web
          image: nginxdemos/nginx-hello:plain-text
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: "25m", memory: "32Mi"}
            limits: {cpu: "100m", memory: "64Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: triage
spec:
  selector: {app: shop}
  ports: [{name: http, port: 80, targetPort: 8080}]
