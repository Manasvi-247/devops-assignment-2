# Exits 1 on purpose. The log says why.
apiVersion: v1
kind: Pod
metadata:
  name: broken-crashloop
  namespace: triage
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'FATAL: config file /etc/app/config.yaml not found'; exit 1"]
      resources:
        requests: {cpu: "10m", memory: "16Mi"}
        limits: {cpu: "50m", memory: "32Mi"}
