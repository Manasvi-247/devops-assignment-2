# emptyDir lives and dies with the pod. Two containers share it.
apiVersion: v1
kind: Pod
metadata:
  name: vol-emptydir
  namespace: storage-lab
spec:
  volumes:
    - name: scratch
      emptyDir: {}
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "echo 'written by the writer' > /scratch/note.txt; sleep 3600"]
      volumeMounts:
        - {name: scratch, mountPath: /scratch}
      resources:
        requests: {cpu: "10m", memory: "16Mi"}
        limits: {cpu: "50m", memory: "32Mi"}
    - name: reader
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - {name: scratch, mountPath: /scratch}
      resources:
        requests: {cpu: "10m", memory: "16Mi"}
        limits: {cpu: "50m", memory: "32Mi"}
