# The default StorageClass uses WaitForFirstConsumer, so the PVC stays Pending
# until a pod actually needs it. This is that pod.
apiVersion: v1
kind: Pod
metadata:
  name: dynamic-user
  namespace: storage-lab
spec:
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: dynamic-pvc
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'dynamic volume works' > /data/hello.txt; sleep 3600"]
      volumeMounts:
        - {name: data, mountPath: /data}
      resources:
        requests: {cpu: "10m", memory: "16Mi"}
        limits: {cpu: "50m", memory: "32Mi"}
