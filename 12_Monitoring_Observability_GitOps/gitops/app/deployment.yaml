apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo
  namespace: gitops-demo
  labels: {app: gitops-demo}
spec:
  replicas: 2
  selector:
    matchLabels: {app: gitops-demo}
  template:
    metadata:
      labels: {app: gitops-demo}
    spec:
      containers:
        - name: web
          image: nginxdemos/nginx-hello:plain-text
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: "25m", memory: "32Mi"}
            limits: {cpu: "100m", memory: "64Mi"}
