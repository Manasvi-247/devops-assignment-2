# INVALID ON PURPOSE. spec.selector.matchLabels says app=frontend but the pod
# template is labelled app=backend. The API server rejects this at admission
# because a Deployment's selector must match its own template.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: selector-error-demo
  namespace: workloads
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: web
          image: nginx:1.29-alpine
          resources:
            requests: {cpu: "25m", memory: "32Mi"}
            limits: {cpu: "100m", memory: "64Mi"}
