# Startup probe. Protects a slow booting app: the liveness probe is held off
# until the startup probe succeeds, so a long boot is not mistaken for a hang.
# Startup allows 30 x 2s = 60s to come up, liveness is aggressive after that.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-startup
  namespace: lifecycle
spec:
  containers:
    - name: slow-boot
      image: busybox:1.36
      command: ["sh", "-c", "sleep 25; touch /tmp/started; sleep 3600"]
      startupProbe:
        exec:
          command: ["cat", "/tmp/started"]
        periodSeconds: 2
        failureThreshold: 30
      livenessProbe:
        exec:
          command: ["cat", "/tmp/started"]
        periodSeconds: 3
        failureThreshold: 1
      resources:
        requests: {cpu: "10m", memory: "16Mi"}
        limits: {cpu: "50m", memory: "32Mi"}
