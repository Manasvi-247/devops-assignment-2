# Multi container pod: app plus a logging sidecar reading the same volume.
# READY shows 2/2.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-multi-container
  namespace: lifecycle
spec:
  volumes:
    - name: logs
      emptyDir: {}
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "i=0; while true; do i=$((i+1)); echo \"$(date +%T) app request $i\" >> /var/log/app.log; sleep 3; done"]
      volumeMounts:
        - {name: logs, mountPath: /var/log}
      resources:
        requests: {cpu: "10m", memory: "16Mi"}
        limits: {cpu: "50m", memory: "32Mi"}
    - name: sidecar
      image: busybox:1.36
      command: ["sh", "-c", "sleep 5; tail -f /var/log/app.log"]
      volumeMounts:
        - {name: logs, mountPath: /var/log}
      resources:
        requests: {cpu: "10m", memory: "16Mi"}
        limits: {cpu: "50m", memory: "32Mi"}
