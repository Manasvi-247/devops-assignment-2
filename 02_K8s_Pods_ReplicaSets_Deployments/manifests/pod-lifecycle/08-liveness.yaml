# Liveness probe. /tmp/healthy is deleted after 15s, the probe then fails
# three times and the kubelet restarts the container. RESTARTS ticks up.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-liveness
  namespace: lifecycle
spec:
  containers:
    - name: unhealthy
      image: busybox:1.36
      command: ["sh", "-c", "touch /tmp/healthy; sleep 15; rm -f /tmp/healthy; sleep 3600"]
      livenessProbe:
        exec:
          command: ["cat", "/tmp/healthy"]
        initialDelaySeconds: 3
        periodSeconds: 3
        failureThreshold: 3
      resources:
        requests: {cpu: "10m", memory: "16Mi"}
        limits: {cpu: "50m", memory: "32Mi"}
