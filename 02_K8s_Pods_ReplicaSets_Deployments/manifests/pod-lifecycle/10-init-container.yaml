# Init container. Runs to completion before the app container starts at all.
# Pod status shows Init:0/1 while it works.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-init
  namespace: lifecycle
spec:
  initContainers:
    - name: setup
      image: busybox:1.36
      command: ["sh", "-c", "echo 'init: preparing config'; sleep 10; echo 'ready for app' > /work/config.txt; echo 'init: done'"]
      volumeMounts:
        - {name: work, mountPath: /work}
      resources:
        requests: {cpu: "10m", memory: "16Mi"}
        limits: {cpu: "50m", memory: "32Mi"}
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'app sees:'; cat /work/config.txt; sleep 3600"]
      volumeMounts:
        - {name: work, mountPath: /work}
      resources:
        requests: {cpu: "10m", memory: "16Mi"}
        limits: {cpu: "50m", memory: "32Mi"}
  volumes:
    - name: work
      emptyDir: {}
