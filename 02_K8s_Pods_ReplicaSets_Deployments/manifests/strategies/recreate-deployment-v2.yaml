apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-recreate
  namespace: strategies
spec:
  replicas: 3
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: app-recreate}
  template:
    metadata:
      labels: {app: app-recreate, version: v2}
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          args: ["-text=VERSION: v2 (UPGRADED)", "-listen=:5678"]
          ports: [{name: http, containerPort: 5678}]
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests: {cpu: "10m", memory: "16Mi"}
            limits: {cpu: "50m", memory: "32Mi"}
