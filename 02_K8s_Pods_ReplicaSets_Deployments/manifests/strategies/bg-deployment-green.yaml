apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
  namespace: strategies
spec:
  replicas: 3
  selector:
    matchLabels: {app: myapp, slot: green}
  template:
    metadata:
      labels: {app: myapp, slot: green, version: v2}
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          args: ["-text=GREEN ENVIRONMENT v2", "-listen=:5678"]
          ports: [{name: http, containerPort: 5678}]
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests: {cpu: "10m", memory: "16Mi"}
            limits: {cpu: "50m", memory: "32Mi"}
