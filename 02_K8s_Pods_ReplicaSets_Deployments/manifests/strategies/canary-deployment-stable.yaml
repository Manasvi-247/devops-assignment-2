apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-stable
  namespace: strategies
spec:
  replicas: 9
  selector:
    matchLabels: {app: myapp-canary, track: stable}
  template:
    metadata:
      labels: {app: myapp-canary, track: stable}
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          args: ["-text=STABLE v1", "-listen=:5678"]
          ports: [{name: http, containerPort: 5678}]
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests: {cpu: "10m", memory: "16Mi"}
            limits: {cpu: "50m", memory: "32Mi"}
