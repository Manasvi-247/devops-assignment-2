# The fix: template labels match the selector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: selector-error-demo
  namespace: workloads
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: web
          image: nginx:1.29-alpine
          resources:
            requests: {cpu: "25m", memory: "32Mi"}
            limits: {cpu: "100m", memory: "64Mi"}
