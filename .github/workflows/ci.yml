name: CI

# Path scoped on purpose so routine pushes to other folders do not spend
# runner minutes. workflow_dispatch allows a manual run at any time.
on:
  push:
    branches: [main]
    paths:
      - '13_Final_Project_TaskBoard/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '13_Final_Project_TaskBoard/**'
  workflow_dispatch:

jobs:
  test:
    name: pytest on ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: 13_Final_Project_TaskBoard/backend/requirements.txt

      - name: Install dependencies
        working-directory: 13_Final_Project_TaskBoard/backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      # the test module pins DATABASE_URL to sqlite itself, so no database
      # service is needed here
      - name: Run tests
        working-directory: 13_Final_Project_TaskBoard/backend
        run: pytest -v --junitxml=report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-py${{ matrix.python }}
          path: 13_Final_Project_TaskBoard/backend/report.xml
          retention-days: 7

  build:
    name: Build images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: 13_Final_Project_TaskBoard/backend
          push: false
          tags: taskboard-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: 13_Final_Project_TaskBoard/frontend
          push: false
          tags: taskboard-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  summary:
    name: Pipeline summary
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "### Pipeline result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
