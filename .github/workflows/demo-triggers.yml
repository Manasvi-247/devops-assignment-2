name: Trigger and job concepts

# Manual only, so it never fires on a push. Run it from the Actions tab to
# see triggers, inputs, parallel vs sequential jobs, conditionals, secrets
# and artifacts in one place.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      run_slow_job:
        description: Also run the optional job
        type: boolean
        default: false

jobs:
  first:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.make.outputs.stamp }}
    steps:
      - id: make
        run: echo "stamp=$(date -u +%H%M%S)" >> $GITHUB_OUTPUT

      - name: Show context
        run: |
          echo "event:       ${{ github.event_name }}"
          echo "environment: ${{ inputs.environment }}"
          echo "runner:      ${{ runner.os }}"

  # these two have no needs, so they run at the same time as each other
  parallel-a:
    runs-on: ubuntu-latest
    steps:
      - run: echo "job A"

  parallel-b:
    runs-on: ubuntu-latest
    steps:
      - run: echo "job B"

  # this one waits, because it declares needs
  sequential:
    runs-on: ubuntu-latest
    needs: [first, parallel-a, parallel-b]
    steps:
      - name: Multi line step
        run: |
          echo "stamp from the first job: ${{ needs.first.outputs.stamp }}"
          echo "this step has several commands"

      - name: Only on production
        if: inputs.environment == 'production'
        run: echo "would deploy to production"

      - name: Only on staging
        if: inputs.environment == 'staging'
        run: echo "would deploy to staging"

      - name: Use a secret
        env:
          TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DEMO_TOKEN is not set, so secrets are not configured yet"
          else
            echo "DEMO_TOKEN is set and has ${#TOKEN} characters"
          fi
          echo "the value itself is masked by the runner if printed"

      - name: Produce an artifact
        run: |
          mkdir -p out
          echo "built for ${{ inputs.environment }} at ${{ needs.first.outputs.stamp }}" > out/result.txt

      - uses: actions/upload-artifact@v4
        with:
          name: demo-result
          path: out/result.txt

  optional:
    runs-on: ubuntu-latest
    needs: first
    if: inputs.run_slow_job
    steps:
      - run: echo "only runs when the boolean input is true"
