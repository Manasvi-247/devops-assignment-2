# NodePort opens the same port on EVERY node, and still creates a ClusterIP
# underneath. Range is 30000-32767.
apiVersion: v1
kind: Service
metadata:
  name: hello-api-nodeport
  namespace: svc-lab
  labels: {app: hello-api}
spec:
  type: NodePort
  selector: {app: hello-api}
  ports:
    - name: http
      protocol: TCP
      port: 9090        # the service's own port (ClusterIP side)
      targetPort: http  # container port 8080
      nodePort: 30080   # the port opened on each node
