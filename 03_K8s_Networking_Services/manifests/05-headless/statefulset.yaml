# Headless service (clusterIP: None) plus a StatefulSet. DNS returns one A
# record per pod instead of a single virtual IP, and each pod gets its own
# stable name.
apiVersion: v1
kind: Service
metadata:
  name: web-headless
  namespace: svc-lab
  labels: {app: web-stateful}
spec:
  clusterIP: None
  selector: {app: web-stateful}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
# The same pods behind a NORMAL ClusterIP service, for the side by side.
apiVersion: v1
kind: Service
metadata:
  name: web-clusterip
  namespace: svc-lab
  labels: {app: web-stateful}
spec:
  type: ClusterIP
  selector: {app: web-stateful}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web-stateful
  namespace: svc-lab
spec:
  serviceName: web-headless
  replicas: 3
  selector:
    matchLabels: {app: web-stateful}
  template:
    metadata:
      labels: {app: web-stateful}
    spec:
      containers:
        - name: web
          image: nginxdemos/nginx-hello:plain-text
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests: {cpu: "25m", memory: "32Mi"}
            limits: {cpu: "100m", memory: "64Mi"}
